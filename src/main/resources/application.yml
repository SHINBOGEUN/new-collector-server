spring:
  application:
    name: new-collector-server

server:
  port: 8081

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
    try-it-out-enabled: true
    filter: true
    display-request-duration: true

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    net.vivans.dcim: ${APP_LOG_LEVEL:INFO}
  pattern:
    console: "%d{MM-dd HH:mm:ss.SSS} %-5level [collector] [%-18.18thread] %-36.36logger{36} | %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [collector] [%-18.18thread] %-48.48logger{48} | %msg%n"
  file:
    name: ${LOG_FILE_NAME:./logs/application.log}

app:
  version: 1.0.0

security:
  auth-enabled: true
  api-key: ${COLLECTOR_API_KEY:manager-server}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

collector:
  mqtt:
    enabled: ${MQTT_ENABLED:true}
    broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
    client-id: ${MQTT_CLIENT_ID:new-collector-server}
    topic: ${MQTT_TOPIC:dcim/sensor/data}
    realtime-topic: ${MQTT_REALTIME_TOPIC:dcim/sensor/realtime}
    pue-topic: ${MQTT_PUE_TOPIC:dcim/derived/pue}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}
